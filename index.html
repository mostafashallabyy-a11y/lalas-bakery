    <script>
      // منع وميض الوضع الغلط: طبّق الاختيار المحفوظ قبل أي رسم
      (function () {
        try {
          var t = localStorage.getItem("lalas_theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {
          /* private mode — سيبها على تفضيل النظام */
        }
      })();
    </script>

    <!--
      تسخين المنيو: بنبدأ طلب بيانات المنيو وأول 5 صور فورًا وReact لسه بينزل.
      النتيجة: الصورة الكبيرة بتظهر أسرع بكتير على النت البطيء.
      لو أي حاجة فشلت، React بيجيب البيانات بنفسه عادي (fallback).
    -->
    <script>
      (function () {
        var m = location.pathname.match(
          /^\/branch\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i
        );
        if (!m) return;
        var base = "%VITE_SUPABASE_URL%";
        var key = "%VITE_SUPABASE_PUBLISHABLE_KEY%";
        if (base.indexOf("http") !== 0 || !key || key.indexOf("%") === 0) return;

        var H = { apikey: key, Authorization: "Bearer " + key };
        var id = m[1];
        var get = function (path) {
          return fetch(base + "/rest/v1/" + path, { headers: H })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        };

        var products = get("products?select=*&branch_id=eq." + id + "&is_active=eq.true&order=sort_order");
        var categories = get("categories?select=*&is_active=eq.true&order=sort_order");
        var branchName = get("branches?select=name&id=eq." + id).then(function (rows) {
          return rows && rows[0] ? rows[0].name : null;
        });

        window.__menuBoot = { branchId: id, products: products, categories: categories, branchName: branchName };

        // خريطة الصور المحسّنة اللي بتتحقن وقت البناء من src/lib/image-map.json
        var MAP = /*__IMAGE_MAP__*/ {};
        var local = function (u) {
          if (!u) return "";
          var s = String(u);
          var b = s.match(/\/storage\/v1\/object\/public\/product-images\/(.+)$/);
          if (b) {
            var p = b[1];
            try { p = decodeURIComponent(p); } catch (e) { p = b[1]; }
            if (MAP[p]) return "/img/p/" + MAP[p] + "-400.webp";
          }
          if (MAP[s]) return "/img/p/" + MAP[s] + "-400.webp";
          if (/-800\.(webp|jpe?g|png)$/i.test(s)) return s.replace(/-800\./, "-400.");
          return "";
        };

        products.then(function (rows) {
          if (!Array.isArray(rows)) return;
          // المميز الأول (هو أول كارت في شريط "مميز") وبعده باقي المنتجات
          var list = rows.filter(function (p) { return p && Number(p.price) > 0; });
          list.sort(function (a, b) { return (b.featured ? 1 : 0) - (a.featured ? 1 : 0); });
          var started = 0;
          for (var i = 0; i < list.length && started < 5; i++) {
            var src = local(list[i].image_url);
            if (!src) continue;
            var img = new Image();
            img.decoding = "async";
            img.src = src;
            started++;
          }
        });
      })();
    </script>

    <!-- هيكل البداية: بيترسم فورًا (قبل ما الجافاسكريبت ينزل) وبعدين React بيستبدله -->
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        background: #fbf3f4;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #241a1d;
        }
      }
      html[data-theme="light"] body {
        background: #fbf3f4;
      }
      html[data-theme="dark"] body {
        background: #241a1d;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .boot img {
        width: 104px;
        height: auto;
        opacity: 0.92;
      }
      .boot-t {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        font-size: 14px;
        font-weight: 700;
        color: #8d5163;
      }
      html[data-theme="dark"] .boot-t {
        color: #e2b6c3;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) .boot-t {
          color: #e2b6c3;
        }
      }
      .boot-bar {
        width: 118px;
        height: 6px;
        border-radius: 99px;
        background: linear-gradient(90deg, #f0cfd7, #d98aa1, #f0cfd7);
        background-size: 200% 100%;
        animation: boot-sh 1.15s linear infinite;
      }
      @keyframes boot-sh {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar {
          animation: none;
        }
      }
    </style>

        <p class="boot-t">بنجهّز المنيو…</p>
