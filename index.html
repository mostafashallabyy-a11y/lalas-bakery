<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf3f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#241a1d" />
    <meta name="description" content="مخبوزات وقهوة منزلية تُحضّر بكل حب من لالا." />
    <title>Lala's Bakery | مخبوزات وقهوة منزلية</title>

    <link rel="canonical" href="https://www.lalasbakery.app/" />
    <link rel="preconnect" href="https://lnyodqfksuvgmqkamvbp.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://lnyodqfksuvgmqkamvbp.supabase.co" />

    <meta property="og:title" content="Lala's Bakery | مخبوزات وقهوة منزلية" />
    <meta property="og:description" content="مخبوزات وقهوة منزلية تُحضّر بكل حب من لالا." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.lalasbakery.app/" />
    <meta property="og:image" content="https://www.lalasbakery.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:site_name" content="Lala's Bakery" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lala's Bakery | مخبوزات وقهوة منزلية" />
    <meta name="twitter:description" content="مخبوزات وقهوة منزلية تُحضّر بكل حب من لالا." />
    <meta name="twitter:image" content="https://www.lalasbakery.app/og-image.png" />

    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />

    <script>
      // منع وميض الوضع الغلط: طبّق الاختيار المحفوظ قبل أي رسم
      (function () {
        try {
          var t = localStorage.getItem("lalas_theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {
          /* private mode — سيبها على تفضيل النظام */
        }
      })();
    </script>

    <link rel="icon" type="image/png" href="/favicon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Bakery",
        "name": "Lala's Bakery",
        "url": "https://www.lalasbakery.app/",
        "image": "https://www.lalasbakery.app/og-image.png",
        "logo": "https://www.lalasbakery.app/lalas-logo.png",
        "description": "مخبوزات وقهوة منزلية تُحضّر بكل حب من لالا.",
        "servesCuisine": ["Bakery", "Coffee", "Dessert"],
        "areaServed": {
          "@type": "Place",
          "name": "العبور"
        },
        "inLanguage": "ar",
        "potentialAction": {
          "@type": "OrderAction",
          "target": "https://www.lalasbakery.app/"
        }
      }
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- هيكل البداية: بيترسم فورًا (قبل ما الجافاسكريبت ينزل) وبعدين React بيستبدله -->
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        background: #fbf3f4;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #241a1d;
        }
      }
      html[data-theme="light"] body {
        background: #fbf3f4;
      }
      html[data-theme="dark"] body {
        background: #241a1d;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .boot img {
        width: 104px;
        height: auto;
        opacity: 0.92;
      }
      .boot-t {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        font-size: 14px;
        font-weight: 700;
        color: #8d5163;
      }
      html[data-theme="dark"] .boot-t {
        color: #e2b6c3;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) .boot-t {
          color: #e2b6c3;
        }
      }
      .boot-bar {
        width: 118px;
        height: 6px;
        border-radius: 99px;
        background: linear-gradient(90deg, #f0cfd7, #d98aa1, #f0cfd7);
        background-size: 200% 100%;
        animation: boot-sh 1.15s linear infinite;
      }
      @keyframes boot-sh {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="بنجهّز المنيو…">
        <img src="/lalas-logo-240.webp" width="240" height="183" alt="Lala's Bakery" />
        <p class="boot-t">بنجهّز المنيو…</p>
        <span class="boot-bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
