# Lala's Bakery - Supabase CLI config
# Only the fields needed for `supabase link` / `supabase db push` / `migration list`.
project_id = "lalas-bakery"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://lalas-bakery.pages.dev"
additional_redirect_urls = ["https://lalas-bakery.pages.dev"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enabled = false

[analytics]
enabled = false
