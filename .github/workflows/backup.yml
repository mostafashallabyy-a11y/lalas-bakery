# Weekly database backup (pg_dump custom format) stored as a PRIVATE artifact.
# Only secret required: SUPABASE_DB_PASSWORD (rotated and saved 2026-11-10).
# Hosted on Supabase; runners have no IPv6 -> session pooler required.
name: Supabase weekly backup

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is missing or empty"
            exit 1
          fi
          mkdir -p backups
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          export PGCONNECT_TIMEOUT=15
          pg_dump \
            -h aws-1-eu-central-1.pooler.supabase.com \
            -U postgres.lnyodqfksuvgmqkamvbp \
            -p 5432 \
            -d postgres \
            --no-owner --no-privileges \
            -F c -f "backups/lalas-$(date -u +%Y%m%d-%H%M).dump"
          test -s backups/*.dump || { echo "::error::dump file empty"; exit 1; }
          ls -la backups/

      - name: Upload artifact (private)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30
