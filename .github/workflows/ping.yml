# Keep the free-tier Supabase project awake: pings the REST endpoint
# every 3 days (free tier pauses projects after ~1 week of inactivity).
name: Supabase keep-alive ping

on:
  schedule:
    - cron: "0 4 */3 * *" # every 3 days at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secret"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/branches?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
          # a write-ping keeps realtime/db activity too (touch the minute streak)
          curl -s -o /dev/null \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -X POST \
            -H 'Content-Type: application/json' \
            -u "$SUPABASE_PUBLISHABLE_KEY:" \
            "$SUPABASE_URL/pg/health"
